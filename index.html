<!DOCTYPE html>
<html lang="ms"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Marketing</title>
<script>try{var t=localStorage.getItem("th");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F3F5F8;--sf:#FFFFFF;--ink:#101828;--mu:#667085;--ln:#E4E7EC;--ac:#1D4ED8;--ai:#FFFFFF;--so:#E8EDF6;--hv:#F8FAFC;--sb:#0B1B33;--sbi:#B4C0D6;--na:#6EA0FF;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--sf:#121B2D;--ink:#E7ECF4;--mu:#8D9BB3;--ln:#22304A;--ac:#6EA0FF;--ai:#0B1220;--so:#1C2943;--hv:#16223A;--sb:#09111F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--sf:#121B2D;--ink:#E7ECF4;--mu:#8D9BB3;--ln:#22304A;--ac:#6EA0FF;--ai:#0B1220;--so:#1C2943;--hv:#16223A;--sb:#09111F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--sb);padding:22px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7C8DAA;margin:0 12px 16px;font-weight:600}
nav button{border:0;border-left:2px solid transparent;background:none;color:var(--sbi);font:inherit;font-size:13.5px;font-weight:500;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button[aria-current]{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--na)}
nav .sp{flex:1}
main{padding:28px 32px 56px;min-width:0;max-width:1400px}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:12.5px;margin:3px 0 20px}
.kp,.ch{display:grid;gap:14px;margin-bottom:16px}
.kp{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ch{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.k,.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.k{padding:16px 18px}.card{padding:18px}
.k small{display:block;color:var(--mu);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.k b{display:block;margin-top:6px;font-size:24px;font-weight:600;letter-spacing:-.02em}
.card h3{margin:0 0 14px;font-size:13px;font-weight:600}
.r{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;font-size:12.5px;margin:9px 0}
.r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
.r b{font-weight:500}
.tr{height:6px;background:var(--so);border-radius:3px;overflow:hidden}.tr i{display:block;height:100%;background:var(--ac);border-radius:3px}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tw:has(table:empty){display:none}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:10px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--ln)}
th{background:var(--hv);color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
tbody tr:hover td{background:var(--hv)}
tbody tr:last-child td{border-bottom:0}
.btn{border:0;background:var(--ac);color:var(--ai);font:inherit;font-weight:500;padding:10px 18px;border-radius:8px;cursor:pointer}
#auth{max-width:360px;margin:14vh auto;padding:0 20px}
#auth form{display:grid;gap:10px}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}nav h2,nav .sp{display:none}nav button{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav button[aria-current]{border-bottom-color:var(--na)}main{padding:20px 16px 48px}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head>
<body>
<section id="auth" hidden>
<h1>Log masuk</h1><p class="mu">Dashboard Marketing</p>
<form id="lf"><input type="email" id="em" placeholder="emel@contoh.com" required><input type="password" id="pw" placeholder="Password" required><button class="btn" type="submit">Log masuk</button></form>
<p class="mu" id="am"></p>
</section>
<div id="app" hidden>
<nav id="nav"></nav>
<main><h1 id="ttl"></h1><p class="mu" id="st"></p>
<div class="kp" id="kp"></div><div class="ch" id="ch"></div><div class="fl" id="fl"></div>
<div class="tw"><table id="tb"></table></div></main>
</div>
<script>
const sb=supabase.createClient("https://vwlrogostacrrcfncupb.supabase.co","sb_publishable_0Lv6sZ63ZW28sRgs7BiZNA_2ab-Opkk");
const $=i=>document.getElementById(i),MS="janfebmaraprmayjunjulaugsepoctnovdec";
const num=s=>parseFloat(String(s==null?"":s).replace(/[^0-9.-]/g,""))||0;
const rm=n=>"RM"+n.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const pl=n=>n.toLocaleString("en-MY");
const mk=s=>{const m=/([A-Za-z]{3})[a-z]*-(\d{4})\s*$/.exec(s||"");if(!m)return null;const i=MS.indexOf(m[1].toLowerCase());return i<0||i%3?null:m[2]+"-"+String(i/3+1).padStart(2,"0")};
const ml=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString("ms-MY",{month:"short",year:"numeric"});
const st=r=>/^4/.test(r["SALES STAGE"]||"");
// c: [tajuk, medan kumpulan, medan nilai (0 = kira bilangan), bulan?, nombor biasa?]
const T={
"Estimated Sales":{f:["PRODUCT","SALES STAGE","SERVICE TYPE"],k:[["Jumlah nilai projek","ONE TIME SALE"],["Nilai kontrak","ONE TIME SALE",st]],c:[["Nilai ikut peringkat","SALES STAGE","ONE TIME SALE"],["Nilai ikut produk","PRODUCT","ONE TIME SALE"],["Jangkaan siap ikut bulan","EXPECTED END DATE","ONE TIME SALE",1]]},
"Current Sales":{f:["_g","SALES STAGE","SERVICE TYPE"],k:[["Jumlah jualan","PROJECT VALUE (RM)"]],c:[["Nilai ikut kumpulan","_g","PROJECT VALUE (RM)"],["Nilai ikut peringkat","SALES STAGE","PROJECT VALUE (RM)"],["Siap ikut bulan","EXPECTED END DATE","PROJECT VALUE (RM)",1]]},
"Leads List":{f:["PRODUCT","STATUS","AREA"],k:[],c:[["Leads ikut sumber","STATUS"],["Leads ikut produk","PRODUCT"],["Leads ikut bulan","FIRST CONTACT DATE",0,1]]},
"Campaign & Lead":{f:["_g","PROJECT"],k:[["Jumlah outreach","TOTAL OUTREACH",0,1],["Jumlah leads","TOTAL LEADS",0,1],["Nilai projek","PROJECT VALUE (RM)"]],c:[["Outreach ikut projek","PROJECT","TOTAL OUTREACH",0,1]]},
"Summary":{kv:1}
};
const TH=["auto","light","dark"],TL={auto:"Auto",light:"Cerah",dark:"Gelap"};
let th="auto";try{th=localStorage.getItem("th")||"auto"}catch(e){}
function setTh(v){th=v;try{localStorage.setItem("th",v)}catch(e){}if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v}
let DB={},cur="Estimated Sales",q="",sel={};

async function load(){
  let all=[],f=0;
  for(;;){
    const {data,error}=await sb.from("sheet_rows").select("tab,row_no,grp,data").order("tab").order("row_no").range(f,f+999);
    if(error){$("st").textContent="Gagal memuatkan: "+error.message;return}
    all=all.concat(data);if(data.length<1000)break;f+=1000;
  }
  DB={};
  all.forEach(r=>{const d={};Object.entries(r.data).forEach(([k,v])=>{d[k.trim().toUpperCase()]=v});d._g=r.grp||"";(DB[r.tab]=DB[r.tab]||[]).push(d)});
  $("st").textContent="Dikemas kini "+new Date().toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"})+" (disegarkan setiap minit)";
}
function nav(){
  const n=$("nav");n.innerHTML="<h2>Dashboard Marketing</h2>";
  Object.keys(T).forEach(t=>{const b=document.createElement("button");b.textContent=t;if(t===cur)b.setAttribute("aria-current","true");b.onclick=()=>{cur=t;q="";sel={};nav();fil();upd()};n.append(b)});
  const s=document.createElement("div"),o=document.createElement("button");s.className="sp";o.textContent="Log keluar";o.onclick=()=>sb.auth.signOut();const tb=document.createElement("button");tb.textContent="Tema: "+TL[th];tb.onclick=()=>{setTh(TH[(TH.indexOf(th)+1)%3]);nav()};n.append(s,tb,o);
}
function fil(){
  const c=T[cur],box=$("fl"),R=DB[cur]||[];box.innerHTML="";if(c.kv)return;
  const s=document.createElement("input");s.type="text";s.placeholder="Cari...";s.oninput=()=>{q=s.value.toLowerCase();upd()};box.append(s);
  c.f.forEach(f=>{
    const e=document.createElement("select"),o0=document.createElement("option");o0.value="";o0.textContent="Semua "+(f==="_g"?"KUMPULAN":f);e.append(o0);
    [...new Set(R.map(r=>r[f]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement("option");o.value=o.textContent=v;e.append(o)});
    e.onchange=()=>{sel[f]=e.value;upd()};box.append(e);
  });
}
function kpi(l,v){const d=document.createElement("div"),s=document.createElement("small"),b=document.createElement("b");d.className="k";s.textContent=l;b.textContent=v;d.append(s,b);$("kp").append(d)}
function draw(t,e,fm){
  const d=document.createElement("section"),h=document.createElement("h3");d.className="card";h.textContent=t;d.append(h);
  if(!e.length){const p=document.createElement("p");p.className="mu";p.textContent="Tiada data.";d.append(p)}
  const mx=Math.max(...e.map(x=>x[1]),1);
  e.forEach(([k,x])=>{
    const r=document.createElement("div"),a=document.createElement("span"),b=document.createElement("div"),i=document.createElement("i"),c=document.createElement("b");
    r.className="r";a.textContent=k;a.title=k;b.className="tr";i.style.width=(x/mx*100)+"%";b.append(i);c.textContent=fm(x);r.append(a,b,c);d.append(r);
  });
  $("ch").append(d);
}
function bars([t,g,v,m,n],F){
  const o={};
  F.forEach(r=>{const k=m?mk(r[g]):(r[g]||"(kosong)");if(k)o[k]=(o[k]||0)+(v?num(r[v]):1)});
  let e=Object.entries(o);
  e=m?e.sort((a,b)=>a[0]<b[0]?-1:1).map(([k,x])=>[ml(k),x]):e.sort((a,b)=>b[1]-a[1]).slice(0,10);
  draw(t,e,v&&!n?rm:pl);
}
function table(F){
  const ks=[...new Set(F.flatMap(r=>Object.keys(r)))].filter(k=>k!=="_g"||F.some(r=>r._g));
  const tb=$("tb"),hr=document.createElement("tr"),body=document.createElement("tbody"),th=document.createElement("thead");
  ks.forEach(k=>{const e=document.createElement("th");e.textContent=k==="_g"?"KUMPULAN":k;hr.append(e)});th.append(hr);
  F.slice(0,500).forEach(r=>{const tr=document.createElement("tr");ks.forEach(k=>{const e=document.createElement("td");e.textContent=r[k]||"";tr.append(e)});body.append(tr)});
  tb.append(th,body);
}
function upd(){
  const c=T[cur],R=DB[cur]||[];
  $("ttl").textContent=cur;$("kp").innerHTML=$("ch").innerHTML=$("tb").innerHTML="";
  if(c.kv){
    R.filter(r=>/^total/i.test(r.LABEL)).forEach(r=>kpi(r.LABEL,/\d/.test(r.VALUE)?r.VALUE:"—"));
    draw("Hasil ikut bulan",R.filter(r=>!/^total/i.test(r.LABEL)).map(r=>[r.LABEL,num(r.VALUE)]),rm);return;
  }
  const F=R.filter(r=>(!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q)))&&Object.keys(sel).every(k=>!sel[k]||r[k]===sel[k]));
  kpi("Bil. rekod",pl(F.length));
  c.k.forEach(([l,f,p,n])=>{const s=F.filter(p||(()=>true)).reduce((a,r)=>a+num(r[f]),0);kpi(l,n?pl(s):rm(s))});
  c.c.forEach(x=>bars(x,F));
  table(F);
}
$("lf").onsubmit=async e=>{
  e.preventDefault();$("am").textContent="Sila tunggu...";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  $("am").textContent=error?"Gagal log masuk: "+error.message:"";
};
sb.auth.onAuthStateChange((ev,s)=>{
  if(s){$("auth").hidden=true;$("app").hidden=false;if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN")setTimeout(async()=>{await load();nav();fil();upd()},0)}
  else{DB={};$("app").hidden=true;$("auth").hidden=false}
});
setInterval(async()=>{if(!$("app").hidden){await load();upd()}},60000);
</script>
</body></html>
